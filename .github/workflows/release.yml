name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build frontend into package data
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: stamp version
        run: python scripts/stamp_version.py "${GITHUB_REF_NAME}" "$(git rev-parse --short HEAD)"
      - name: build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  smoke:
    # The wheel must install and boot elsewhere than a git checkout.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install + version
        run: |
          python -m pip install --quiet dist/*.whl
          python - <<'EOF'
          import os
          import nautilus._version as v
          expected = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert v.__version__ == expected, (v.__version__, expected)
          assert v.git_commit(), "commit not stamped"
          print("version:", v.__version__, "commit:", v.git_commit())
          EOF
