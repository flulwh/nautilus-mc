name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: type-check + build (writes nautilus/webui/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: committed dist must match a fresh build
        run: git diff --exit-code --stat nautilus/webui/dist
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: nautilus/webui/dist
          retention-days: 7
